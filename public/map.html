<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>* { margin:0; padding:0; } #map { width:100%; height:100vh; }</style>
</head>
<body>
  <div id="map"></div>
  <script>
    const p = new URLSearchParams(location.search);
    const lat = parseFloat(p.get('lat'));
    const lng = parseFloat(p.get('lng'));
    const addr = p.get('addr') || '';

    // sdk.js 먼저
    const s1 = document.createElement('script');
    s1.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=e86fd6c4b97c3607fb429d8f75526f41&autoload=false';
    s1.onload = function() {
      // kakao.js 직접 로드
      const s2 = document.createElement('script');
      s2.src = 'https://t1.daumcdn.net/mapjsapi/js/main/4.5.13/kakao.js';
      s2.onload = function() {
        // 둘 다 로드됨 → 지도 생성
        const map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(lat, lng),
          level: 3
        });
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(lat, lng),
          map: map
        });
        if (addr) {
          const iw = new kakao.maps.InfoWindow({
            content: '<div style="padding:5px 10px;font-size:12px;font-weight:600">' + addr + '</div>'
          });
          iw.open(map, marker);
        }
      };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  </script>
</body>
</html>
