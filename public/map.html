<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin:0; padding:0; }
    #map { width:100%; height:100vh; }
    #map-error {
      display:none; width:100%; height:100vh; box-sizing:border-box;
      align-items:center; justify-content:center; text-align:center;
      padding:12px; font:12px/1.5 -apple-system, sans-serif; color:#71717a; background:#f4f4f5;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="map-error">
    <div>
      <div>지도를 불러오지 못했어요</div>
      <div id="map-error-detail" style="margin-top:6px;font-size:10px;color:#a1a1aa;word-break:break-all;"></div>
    </div>
  </div>
  <script>
    // 예전엔 로딩 실패 시(도메인 미등록, 네트워크 차단 등) 아무 에러도 안 보이고 그냥 빈 흰 화면으로
    // 남아서 원인 파악이 안 됐음 — onerror·타임아웃 둘 다 잡아서 최소한 실패했다는 건 보이게 함(2026-09-09).
    // 이유를 console.error뿐 아니라 화면에도 작게 표시 — 폰에서는 개발자도구를 보기 어려우니
    // 스크린샷만으로 원인을 알 수 있게(2026-09-09).
    function showError(reason) {
      console.error('[map.html] 카카오맵 로딩 실패:', reason, 'UA:', navigator.userAgent, 'referrer:', document.referrer);
      const err = document.getElementById('map-error');
      const detail = document.getElementById('map-error-detail');
      if (detail) detail.textContent = reason;
      if (err) err.style.display = 'flex';
    }

    const p = new URLSearchParams(location.search);
    const lat = parseFloat(p.get('lat'));
    const lng = parseFloat(p.get('lng'));
    const addr = p.get('addr') || '';

    if (!isNaN(lat) && !isNaN(lng)) {
      const timeout = setTimeout(function() { showError('타임아웃(5초 내 SDK 미로드) — 네트워크가 dapi.kakao.com을 못 불렀을 가능성'); }, 5000);
      const script = document.createElement('script');
      script.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=e86fd6c4b97c3607fb429d8f75526f41&autoload=false';
      script.onerror = function() { clearTimeout(timeout); showError('script.onerror — 스크립트 요청 자체가 실패(네트워크 차단)'); };
      script.onload = function() {
        clearTimeout(timeout);
        if (window.kakao && window.kakao.maps) {
          window.kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
              center: new window.kakao.maps.LatLng(lat, lng),
              level: 3
            };
            const map = new window.kakao.maps.Map(container, options);
            const marker = new window.kakao.maps.Marker({
              position: new window.kakao.maps.LatLng(lat, lng),
              map: map
            });
            if (addr) {
              const iw = new window.kakao.maps.InfoWindow({
                content: '<div style="padding:6px 10px;font-size:12px;font-weight:600;color:#000;background:#fff;border-radius:4px;border:1px solid #ccc;white-space:nowrap;">' + addr + '</div>'
              });
              iw.open(map, marker);
            }
          });
        } else {
          showError('스크립트는 로드됐지만 window.kakao.maps 없음 — 앱키 도메인 제한(referrer=' + (document.referrer || '없음') + ')');
        }
      };
      document.head.appendChild(script);
    } else {
      showError('lat/lng 파라미터가 없거나 유효하지 않음(lat=' + p.get('lat') + ', lng=' + p.get('lng') + ')');
    }
  </script>
</body>
</html>
